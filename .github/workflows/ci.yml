name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: nexora, POSTGRES_PASSWORD: nexora, POSTGRES_DB: nexora_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nexora" --health-interval 5s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app
      - run: pytest -q --cov=app --cov-report=term-missing:skip-covered
        env: { DATABASE_URL: "postgresql+psycopg://nexora:nexora@localhost:5432/nexora_test" }
      - name: Dependency audit
        run: pip-audit -r requirements.txt --progress-spinner off || echo "::warning::pip-audit reported findings"
      - name: AI evaluation (demo engine regression gate)
        run: python ../ai-engine/run_eval.py
        env: { EVAL_DATABASE_URL: "postgresql+psycopg://nexora:nexora@localhost:5432/nexora_eval" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reported findings"

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          cp .env.example .env
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
          echo "ENCRYPTION_KEY=$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> .env
          echo "APP_ENV=development" >> .env
          docker compose -f deployment/docker-compose.yml --env-file .env up -d --build --wait web api
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium && npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: frontend/test-results }

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
